name: Awesome List CI

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

jobs:
  awesome-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Install awesome-lint
        run: npm install -g awesome-lint
      - name: Run awesome-lint
        run: awesome-lint

  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --accept 200,201,202,203,204,300,301,302,303,304,307,308 --timeout 10 --max-retries 3 --retry-wait-time 2 --exclude 'medium\.com' --exclude 'reddit\.com' --exclude 'etherscan\.io' --exclude 'awesome\.re' --exclude-path './.git' '**/*.md'
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
